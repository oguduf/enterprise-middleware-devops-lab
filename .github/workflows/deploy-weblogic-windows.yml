name: Manual WebLogic Windows Deployment

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful CI run ID containing the WAR to deploy or restore
        type: string
        required: true
      action:
        description: Deployment operation
        type: choice
        options: [deploy, redeploy, rollback]
        required: true
      confirm_rollback:
        description: Confirm the selected CI artifact is the last-known-good DEV release
        type: boolean
        required: true
        default: false
      dry_run:
        description: Validate artifact and configuration on a GitHub-hosted Windows runner without connecting to WebLogic
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Verify provenance and validate on hosted Windows
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      source_branch: ${{ steps.source.outputs.branch }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Verify source CI run and artifact provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        shell: pwsh
        run: |
          python scripts/verify-ci-artifact.py `
            --repo "$env:GITHUB_REPOSITORY" `
            --run-id "$env:SOURCE_RUN_ID" `
            --artifact-name middleware-demo `
            --output "$env:GITHUB_WORKSPACE\ci-source.json"
          $metadata = Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\ci-source.json" -Raw | ConvertFrom-Json
          "branch=$($metadata.branch)" >> $env:GITHUB_OUTPUT
          "commit=$($metadata.commit)" >> $env:GITHUB_OUTPUT

      - name: Download the verified CI artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: middleware-demo
          path: middleware-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          digest-mismatch: error

      - name: Verify checksum and WAR structure
        id: artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'middleware-artifact'
          $war = Join-Path $artifactDir 'middleware-demo.war'
          $manifest = Join-Path $artifactDir 'middleware-demo.war.sha256'
          if (-not (Test-Path -LiteralPath $war -PathType Leaf)) { throw 'WAR artifact is missing.' }
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'SHA-256 manifest is missing.' }
          $manifestText = (Get-Content -LiteralPath $manifest -Raw).Trim()
          if ($manifestText -notmatch '^([A-Fa-f0-9]{64})\s+\*?middleware-demo\.war$') { throw 'SHA-256 manifest format is invalid.' }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath $war -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw "WAR SHA-256 mismatch: expected $expected; received $actual." }
          python scripts/validate-war.py $war
          "sha256=$actual" >> $env:GITHUB_OUTPUT

      - name: Require explicit rollback confirmation
        if: inputs.action == 'rollback'
        env:
          ROLLBACK_CONFIRMED: ${{ inputs.confirm_rollback }}
        shell: pwsh
        run: |
          if ($env:ROLLBACK_CONFIRMED -ne 'true') { throw 'Rollback requires confirm_rollback=true after verifying the selected artifact is the last-known-good DEV release.' }

      - name: Run offline PowerShell deployment validation
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
          WAR_PATH: ${{ github.workspace }}\middleware-artifact\middleware-demo.war
          WEBLOGIC_WL_HOME: C:\Oracle\Middleware\Oracle_Home\wlserver
          WEBLOGIC_JAVA_EXE: C:\Program Files\Java\jdk-11.0.33.1\bin\java.exe
        shell: pwsh
        run: |
          & .\scripts\deploy-weblogic.ps1 `
            -WarPath $env:WAR_PATH -Action $env:DEPLOY_ACTION `
            -ExpectedSha256 $env:EXPECTED_SHA256 `
            -AdminUrl 't3://localhost:7001' -Target 'AdminServer' `
            -HealthUrl 'http://localhost:7001/middleware-demo/health' `
            -AppName 'middleware-demo' -DryRun

  deploy-live:
    name: Deploy to the local WebLogic DEV domain
    if: github.ref == 'refs/heads/main' && inputs.dry_run == false
    needs: validate
    runs-on: [self-hosted, windows, x64, middleware-devops]
    environment:
      name: DEV
    timeout-minutes: 30
    concurrency:
      group: middleware-DEV-WebLogic-Windows
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      APP_NAME: middleware-demo
      WEBLOGIC_WL_HOME: C:\Oracle\Middleware\Oracle_Home\wlserver
      WEBLOGIC_JAVA_EXE: C:\Program Files\Java\jdk-11.0.33.1\bin\java.exe
      WEBLOGIC_ADMIN_URL: t3://localhost:7001
      WEBLOGIC_TARGET: AdminServer
      WEBLOGIC_HEALTH_URL: http://localhost:7001/middleware-demo/health
      WEBLOGIC_USER_CONFIG_FILE: ${{ vars.WEBLOGIC_USER_CONFIG_FILE }}
      WEBLOGIC_USER_KEY_FILE: ${{ vars.WEBLOGIC_USER_KEY_FILE }}
      DEPLOY_ACTION: ${{ inputs.action }}
      SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out trusted deployment scripts from main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Verify source CI run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python scripts/verify-ci-artifact.py `
            --repo "$env:GITHUB_REPOSITORY" `
            --run-id "$env:SOURCE_RUN_ID" `
            --artifact-name middleware-demo `
            --output "$env:GITHUB_WORKSPACE\ci-source.json"

      - name: Download the verified CI artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: middleware-demo
          path: middleware-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          digest-mismatch: error

      - name: Verify checksum and WAR structure
        id: artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'middleware-artifact'
          $war = Join-Path $artifactDir 'middleware-demo.war'
          $manifest = Join-Path $artifactDir 'middleware-demo.war.sha256'
          if (-not (Test-Path -LiteralPath $war -PathType Leaf)) { throw 'WAR artifact is missing.' }
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'SHA-256 manifest is missing.' }
          $manifestText = (Get-Content -LiteralPath $manifest -Raw).Trim()
          if ($manifestText -notmatch '^([A-Fa-f0-9]{64})\s+\*?middleware-demo\.war$') { throw 'SHA-256 manifest format is invalid.' }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath $war -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw "WAR SHA-256 mismatch: expected $expected; received $actual." }
          python scripts/validate-war.py $war
          "sha256=$actual" >> $env:GITHUB_OUTPUT

      - name: Deploy or roll back with weblogic.Deployer
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
          WAR_PATH: ${{ github.workspace }}\middleware-artifact\middleware-demo.war
        shell: pwsh
        run: |
          & .\scripts\deploy-weblogic.ps1 `
            -WarPath $env:WAR_PATH -Action $env:DEPLOY_ACTION `
            -ExpectedSha256 $env:EXPECTED_SHA256 `
            -AdminUrl $env:WEBLOGIC_ADMIN_URL -Target $env:WEBLOGIC_TARGET `
            -HealthUrl $env:WEBLOGIC_HEALTH_URL -AppName $env:APP_NAME `
            -WlHome $env:WEBLOGIC_WL_HOME -JavaPath $env:WEBLOGIC_JAVA_EXE `
            -UserConfigFile $env:WEBLOGIC_USER_CONFIG_FILE -UserKeyFile $env:WEBLOGIC_USER_KEY_FILE

      - name: Record deployment metadata
        if: success()
        env:
          EXPECTED_SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        shell: pwsh
        run: |
          @(
            '## Windows WebLogic deployment record'
            ''
            "- Environment: DEV"
            "- Operation: $env:DEPLOY_ACTION"
            "- CI run: $env:SOURCE_RUN_ID ($env:SOURCE_BRANCH / $env:SOURCE_COMMIT)"
            "- WAR SHA-256: $env:EXPECTED_SHA256"
            "- Deployment workflow run: $env:GITHUB_RUN_ID"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
