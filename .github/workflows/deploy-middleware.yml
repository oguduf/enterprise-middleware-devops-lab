name: Manual Middleware Deployment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected target environment
        type: choice
        options: [DEV, TEST]
        required: true
      middleware:
        description: Middleware platform
        type: choice
        options: [WebLogic, JBoss]
        required: true
      artifact_run_id:
        description: Successful CI workflow run ID containing the WAR to deploy (or known-good WAR to restore)
        type: string
        required: true
      action:
        description: Deployment action
        type: choice
        options: [deploy, redeploy, rollback]
        required: true
      confirm_rollback:
        description: Set true only after confirming the selected run is the target environment's last-known-good release
        type: boolean
        required: true
        default: false
      dry_run:
        description: Validate configuration and artifact without calling middleware or the health endpoint
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.action }} ${{ inputs.middleware }} to ${{ inputs.target_environment }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, linux, x64, middleware-devops]
    environment:
      name: ${{ inputs.target_environment }}
    timeout-minutes: 45
    concurrency:
      group: middleware-${{ inputs.target_environment }}-${{ inputs.middleware }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENV: ${{ inputs.target_environment }}
      APP_NAME: middleware-demo
      HEALTH_URL: ${{ vars.APP_HEALTH_URL }}
      HEALTH_TIMEOUT_SECONDS: '5'
      HEALTH_INTERVAL_SECONDS: '5'
      HEALTH_ATTEMPTS: '12'
      DEPLOY_TIMEOUT_SECONDS: ${{ vars.DEPLOY_TIMEOUT_SECONDS || '600' }}
      LOG_DIR: ${{ runner.temp }}/middleware-deploy-logs
      WEBLOGIC_ADMIN_URL: ${{ vars.WEBLOGIC_ADMIN_URL }}
      WEBLOGIC_TARGETS: ${{ vars.WEBLOGIC_TARGETS }}
      WEBLOGIC_CLASSPATH: ${{ vars.WEBLOGIC_CLASSPATH }}
      WEBLOGIC_ACTION: ${{ inputs.action == 'redeploy' && 'redeploy' || 'deploy' }}
      JBOSS_HOME: ${{ vars.JBOSS_HOME }}
      JBOSS_CONTROLLER: ${{ vars.JBOSS_CONTROLLER }}
      JBOSS_MODE: ${{ vars.JBOSS_MODE }}
      JBOSS_SERVER_GROUPS: ${{ vars.JBOSS_SERVER_GROUPS }}
      JBOSS_CLI: ${{ vars.JBOSS_CLI }}
      JBOSS_RUNTIME_NAME: middleware-demo.war
      DEPLOY_ACTION: ${{ inputs.action }}
      DRY_RUN: ${{ inputs.dry_run }}
      ROLLBACK_CONFIRMED: ${{ inputs.confirm_rollback }}
      SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_BRANCH_REF: ${{ github.ref }}
    steps:
      - name: Check out deployment scripts from a trusted branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify CI run provenance and artifact record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/verify-ci-artifact.py
          --repo "$GITHUB_REPOSITORY"
          --run-id "$SOURCE_RUN_ID"
          --artifact-name middleware-demo
          --output "$RUNNER_TEMP/ci-source.json"

      - name: Download WAR artifact from the verified CI run
        uses: actions/download-artifact@v8.0.2
        with:
          name: middleware-demo
          path: ${{ runner.temp }}/middleware-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          digest-mismatch: error

      - name: Verify checksum and WAR structure
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/middleware-artifact"
          test -s middleware-demo.war
          test -s middleware-demo.war.sha256
          sha256sum --check middleware-demo.war.sha256
          python3 "$GITHUB_WORKSPACE/scripts/validate-war.py" "$RUNNER_TEMP/middleware-artifact/middleware-demo.war"
          digest="$(awk '{print $1}' middleware-demo.war.sha256)"
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Invalid SHA-256 manifest' >&2; exit 1; }
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Confirm rollback selection
        if: inputs.action == 'rollback'
        env:
          ROLLBACK_CONFIRMED: ${{ inputs.confirm_rollback }}
        run: |
          if [[ "$ROLLBACK_CONFIRMED" != true ]]; then
            echo 'Rollback requires confirm_rollback=true and a run ID previously verified as last-known-good in this environment.' >&2
            exit 1
          fi

      - name: Materialize protected WebLogic credential files
        if: inputs.middleware == 'WebLogic'
        env:
          WLS_USER_CONFIG_B64: ${{ secrets.WEBLOGIC_USER_CONFIG_B64 }}
          WLS_USER_KEY_B64: ${{ secrets.WEBLOGIC_USER_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WLS_USER_CONFIG_B64" && -n "$WLS_USER_KEY_B64" ]] || { echo 'Required WebLogic environment secrets are missing' >&2; exit 1; }
          umask 077
          printf '%s' "$WLS_USER_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/weblogic-user.config"
          printf '%s' "$WLS_USER_KEY_B64" | base64 --decode > "$RUNNER_TEMP/weblogic-user.key"
          chmod 600 "$RUNNER_TEMP/weblogic-user.config" "$RUNNER_TEMP/weblogic-user.key"
          printf 'WEBLOGIC_USER_CONFIG_FILE=%s\n' "$RUNNER_TEMP/weblogic-user.config" >> "$GITHUB_ENV"
          printf 'WEBLOGIC_USER_KEY_FILE=%s\n' "$RUNNER_TEMP/weblogic-user.key" >> "$GITHUB_ENV"

      - name: Materialize protected JBoss Elytron client configuration
        if: inputs.middleware == 'JBoss'
        env:
          JBOSS_WILDFLY_CONFIG_B64: ${{ secrets.JBOSS_WILDFLY_CONFIG_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$JBOSS_WILDFLY_CONFIG_B64" ]] || { echo 'Required JBoss environment secret is missing' >&2; exit 1; }
          umask 077
          printf '%s' "$JBOSS_WILDFLY_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/wildfly-config.xml"
          chmod 600 "$RUNNER_TEMP/wildfly-config.xml"
          printf 'JBOSS_WILDFLY_CONFIG=%s\n' "$RUNNER_TEMP/wildfly-config.xml" >> "$GITHUB_ENV"

      - name: Deploy or roll back to WebLogic
        if: inputs.middleware == 'WebLogic'
        shell: bash
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENV" == DEV ]]; then config_file=config/dev.env.example; else config_file=config/test.env.example; fi
          war="$RUNNER_TEMP/middleware-artifact/middleware-demo.war"
          if [[ "$DEPLOY_ACTION" == rollback ]]; then
            args=(bash scripts/rollback.sh weblogic "$config_file" "$war" "$ARTIFACT_SHA256")
          else
            args=(bash scripts/deploy-weblogic.sh "$config_file" "$war" "$DEPLOY_ACTION")
          fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          "${args[@]}"

      - name: Deploy or roll back to JBoss EAP
        if: inputs.middleware == 'JBoss'
        shell: bash
        env:
          DEPLOY_ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENV" == DEV ]]; then config_file=config/dev.env.example; else config_file=config/test.env.example; fi
          war="$RUNNER_TEMP/middleware-artifact/middleware-demo.war"
          if [[ "$DEPLOY_ACTION" == rollback ]]; then
            args=(bash scripts/rollback.sh jboss "$config_file" "$war" "$ARTIFACT_SHA256")
          else
            args=(bash scripts/deploy-jboss.sh "$config_file" "$war")
          fi
          if [[ "$DRY_RUN" == true && "$DEPLOY_ACTION" != rollback ]]; then args+=(--dry-run); fi
          if [[ "$DRY_RUN" == true && "$DEPLOY_ACTION" == rollback ]]; then args+=(--dry-run); fi
          "${args[@]}"

      - name: Record deployment metadata
        if: success()
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          SOURCE_METADATA_FILE: ${{ runner.temp }}/ci-source.json
        shell: bash
        run: |
          set -euo pipefail
          source_branch="$(python3 -c 'import json,os; print(json.load(open(os.environ["SOURCE_METADATA_FILE"]))["branch"])')"
          source_commit="$(python3 -c 'import json,os; print(json.load(open(os.environ["SOURCE_METADATA_FILE"]))["commit"])')"
          {
            echo '## Middleware deployment record'
            echo
            echo "- Environment: $DEPLOY_ENV"
            echo "- Middleware: ${{ inputs.middleware }}"
            echo "- Action: $DEPLOY_ACTION"
            echo "- Dry run: $DRY_RUN"
            echo "- CI run: $SOURCE_RUN_ID ($source_branch / $source_commit)"
            echo "- WAR SHA-256: $ARTIFACT_SHA256"
            echo "- Deployment workflow run: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
